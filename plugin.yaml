name: obol
version: 0.1.0
description: "Security-first Stripe invoicing for builders who bill clients (indie developers, AI consultants, agencies). Hermes drafts invoices (also from forwarded messages), sends Stripe payment links and tracks who has paid, while Obol guards the money path: prompt-injection and lookalike-domain detection, impersonation and duplicate checks, approval on every Stripe write, Radar and dispute visibility, and a hash-chained log. Test mode by default."
author: UEddy
requires_hermes: ">=0.22"
provides_tools:
  - obol_create_invoice
  - obol_send_invoice
  - obol_get_invoice
  - obol_list_invoices
  - obol_send_reminder
  - obol_void_invoice
  - obol_draft_from_message
provides_hooks:
  - pre_tool_call
  - post_tool_call
  - pre_llm_call
requires_env:
  - name: STRIPE_API_KEY
    description: "Stripe secret or restricted key. Use a TEST key (sk_test_...) unless you have turned on allow_live."
    url: "https://dashboard.stripe.com/test/apikeys"
    secret: true
config_schema:
  stripe_api_key:
    type: secret
    env: STRIPE_API_KEY
    label: "Stripe API key"
    description: "Test key (sk_test_...) recommended. Stored in Hermes's .env, never in config.yaml."
  allow_live:
    type: bool
    default: false
    label: "Allow live mode"
    description: "Off: live Stripe keys are refused, so no real customer is ever billed."
  default_currency:
    type: str
    default: usd
    label: "Default currency"
  default_days_until_due:
    type: int
    default: 14
    label: "Days until due"
  risk_duplicate_window_days:
    type: int
    default: 30
    label: "Risk check: duplicate window (days)"
    description: "Flag an invoice with the same customer and amount as one created within this many days. 0 turns it off."
  risk_amount_multiplier:
    type: float
    default: 3.0
    label: "Risk check: unusual amount (x average)"
    description: "Flag an invoice above this multiple of the customer's average invoice. 0 turns it off."
  risk_amount_min_history:
    type: int
    default: 3
    label: "Risk check: invoices needed for an average"
    description: "How many past invoices a customer needs before the unusual-amount check applies."
  risk_contact_change_days:
    type: int
    default: 14
    label: "Risk check: recent contact/payment change (days)"
    description: "Flag when the customer's email or payment details changed in Stripe this recently. 0 turns it off. Max 30 (Stripe keeps 30 days of events)."
  risk_lookalike_domains:
    type: bool
    default: true
    label: "Risk check: lookalike domains"
    description: "Flag a billing email whose domain imitates one you've billed (acrne.example vs acme.example)."
  guard_tools:
    type: list
    default: []
    label: "Obol Guard: other plugins' money tools"
    description: "Off when empty. Tool names (or patterns like laso_*) from other plugins that move money, e.g. agentwalletapi_transfer_send. Each call then needs your approval, is blocked in unattended runs, is checked for injected instructions and unusual amounts or recipients, and is logged."
  guard_amount_multiplier:
    type: float
    default: 3.0
    label: "Obol Guard: unusual amount (x typical)"
    description: "Flag a guarded call above this multiple of that tool's typical amount. 0 turns it off."
  guard_min_history:
    type: int
    default: 3
    label: "Obol Guard: calls needed for a typical amount"
  risk_impersonation:
    type: bool
    default: true
    label: "Risk check: known client, new domain"
    description: "Flag a client name you've billed before when the email is at a domain you've never used for them."
