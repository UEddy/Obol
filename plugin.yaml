name: obol
version: 0.1.0
description: "Invoices and payment links from chat, backed by Stripe. Hermes drafts and sends invoices, checks who has paid, chases overdue ones, and keeps a receivables ledger you can pull up with /invoices. Test mode by default; every send asks for your approval."
author: UEddy
requires_hermes: ">=0.22"
provides_tools:
  - obol_create_invoice
  - obol_send_invoice
  - obol_get_invoice
  - obol_list_invoices
  - obol_send_reminder
  - obol_void_invoice
  - obol_draft_from_message
provides_hooks:
  - pre_tool_call
requires_env:
  - name: STRIPE_API_KEY
    description: "Stripe secret or restricted key. Use a TEST key (sk_test_...) unless you have turned on allow_live."
    url: "https://dashboard.stripe.com/test/apikeys"
    secret: true
config_schema:
  stripe_api_key:
    type: secret
    env: STRIPE_API_KEY
    label: "Stripe API key"
    description: "Test key (sk_test_...) recommended. Stored in Hermes's .env, never in config.yaml."
  allow_live:
    type: bool
    default: false
    label: "Allow live mode"
    description: "Off: live Stripe keys are refused, so no real customer is ever billed."
  default_currency:
    type: str
    default: usd
    label: "Default currency"
  default_days_until_due:
    type: int
    default: 14
    label: "Days until due"
  risk_duplicate_window_days:
    type: int
    default: 30
    label: "Risk check: duplicate window (days)"
    description: "Flag an invoice with the same customer and amount as one created within this many days. 0 turns it off."
  risk_amount_multiplier:
    type: float
    default: 3.0
    label: "Risk check: unusual amount (x average)"
    description: "Flag an invoice above this multiple of the customer's average invoice. 0 turns it off."
  risk_amount_min_history:
    type: int
    default: 3
    label: "Risk check: invoices needed for an average"
    description: "How many past invoices a customer needs before the unusual-amount check applies."
  risk_contact_change_days:
    type: int
    default: 14
    label: "Risk check: recent contact/payment change (days)"
    description: "Flag when the customer's email or payment details changed in Stripe this recently, or when the same client name was billed at a different email. 0 turns it off. Max 30 (Stripe keeps 30 days of events)."
