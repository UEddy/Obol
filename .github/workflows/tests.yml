name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Install test dependencies
        # Same httpx version Hermes pins; fastapi for the dashboard-API tests.
        run: pip install "httpx==0.28.1" "fastapi>=0.115,<1" "pytest>=8,<10"
      - name: Run tests
        # The Stripe test-mode suite runs only when a STRIPE_API_KEY (sk_test_) secret is set.
        env:
          STRIPE_API_KEY: ${{ secrets.STRIPE_API_KEY }}
        run: python -m pytest -q
