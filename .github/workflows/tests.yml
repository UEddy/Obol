name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  unit:
    name: Unit and adversarial tests (no Hermes)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Install test dependencies
        # Same httpx version Hermes pins; fastapi for the dashboard-API tests.
        run: pip install "httpx==0.28.1" "fastapi>=0.115,<1" "pytest>=8,<10"
      - name: Run tests
        # The Stripe test-mode suite runs only when a STRIPE_API_KEY (sk_test_) secret is set.
        env:
          STRIPE_API_KEY: ${{ secrets.STRIPE_API_KEY }}
        run: python -m pytest -q

  hermes:
    name: Full suite inside Hermes (plugin manager, gateways, validate, doctor)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          path: obol
      - uses: actions/checkout@v4
        with:
          repository: NousResearch/hermes-agent
          path: hermes-agent
      - uses: astral-sh/setup-uv@v6
      - name: Install Hermes Agent
        run: |
          uv venv --python 3.14 hvenv
          cd hermes-agent && VIRTUAL_ENV=../hvenv uv pip install -e . "pytest>=8,<10" "pytest-asyncio>=0.23"
      - name: Run every test, with Hermes importable
        working-directory: obol
        env:
          STRIPE_API_KEY: ${{ secrets.STRIPE_API_KEY }}
        run: ../hvenv/bin/python -m pytest -q
      - name: hermes plugins validate and doctor
        env:
          HERMES_HOME: ${{ runner.temp }}/hermes-home
        run: |
          mkdir -p "$HERMES_HOME"
          hvenv/bin/hermes plugins validate obol --install-deps
          hvenv/bin/hermes plugins doctor --ci obol
