# plugin-catalog/obol.yaml for NousResearch/hermes-agent, pinned to the submitted commit.
# Validated at that sha with `hermes plugins validate` and `hermes plugins doctor --ci`.
name: obol
title: Obol
repo: https://github.com/UEddy/Obol
sha: PINNED_SHA
description: "Security-first Stripe invoicing for builders who bill clients (indie developers, AI consultants, agencies building agents), from any chat Hermes runs in (verified: Telegram, WhatsApp, Slack, email and the terminal): Hermes drafts invoices (also from forwarded Telegram/WhatsApp/Slack/email messages via ctx.llm), sends Stripe payment links, tracks who has paid, and shows Invoices and Security views in the dashboard plus /invoices in every chat. Obol protects the money path: deterministic prompt-injection detection (direct, hidden, multilingual, encoded) that can never choose the recipient, lookalike-domain and impersonation checks, duplicate and unusual-amount checks, approval on every Stripe write, live keys refused unless allowed, writes refused in unattended runs, Stripe Radar risk and disputes on paid invoices (read-only), and hash-chained activity and security logs verified by hermes obol doctor. Disclosure: HTTPS calls to api.stripe.com only (tool use, /invoices sync, hermes obol doctor|sync, the approval hook refreshing the customer's invoices and recent customer.updated events, sync reading charges/disputes and test clocks, and every 45 s while the dashboard tab is open); forwarded messages go to the user's configured model through ctx.llm; Stripe emails clients when invoices are sent or reminded; reads STRIPE_API_KEY via get_secret only; stores an invoice-metadata cache, risk findings, and hash-chained activity and security logs in plugin-data/obol/data.db; polling, no webhooks; no telemetry, shell commands or background processes."
maintainer: UEddy
tier: community
category: tools
requires_hermes: ">=0.22"
version: "0.1.0"
docs_url: https://github.com/UEddy/Obol#readme
screenshots:
  - https://raw.githubusercontent.com/UEddy/Obol/PINNED_SHA/docs/screenshots/dashboard-invoices.png
  - https://raw.githubusercontent.com/UEddy/Obol/PINNED_SHA/docs/screenshots/dashboard-security.png
  - https://raw.githubusercontent.com/UEddy/Obol/PINNED_SHA/docs/screenshots/approval.png
  - https://raw.githubusercontent.com/UEddy/Obol/PINNED_SHA/docs/screenshots/approval-scam.png
platforms: []
capabilities:
  provides_tools:
    - obol_create_invoice
    - obol_send_invoice
    - obol_get_invoice
    - obol_list_invoices
    - obol_send_reminder
    - obol_void_invoice
    - obol_draft_from_message
  provides_hooks:
    - pre_tool_call
  provides_middleware: []
  requires_env:
    - STRIPE_API_KEY
